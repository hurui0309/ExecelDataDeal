# ===== 第二阶段：归纳汇总 配置 =====

database:
  host: "localhost"
  port: 3306
  user: "root"
  password: "123456"
  database: "ods_data"
  charset: "utf8mb4"

llm:
  standard:
    api_base: "http://chat.hzau.edu.cn:3000/v1/"
    api_key: "sk-dtrQQelwfcectVDL4f485e9801104cD382Ec71Ae62A16042"
    model: "qwen3-32b"
  temperature: 0.1
  max_tokens: 4096

index:
  # 增量模式：只索引 ods_sheet_metadata 中 id > last_indexed_id 的记录
  incremental: true
  # 同义词发现：是否使用 LLM 发现字段同义词（建议首次全量时开启，后续增量时关闭）
  discover_synonyms: true
  # 同义词发现并发数
  synonym_concurrency: 2
  # 同义词发现批次大小（每次 LLM 调用处理的字段数）
  synonym_batch_size: 50

logging:
  level: "INFO"
  file: "./logs/phase2_index_%Y%m%d_%H%M%S.log"
  max_bytes: 10485760
  backup_count: 30
